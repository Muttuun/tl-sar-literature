
name: Update TL-SAR Literature

on:
  schedule:
    - cron: "0 16 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-literature:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search recent papers
        run: python scripts/search_papers.py

      - name: Merge and deduplicate papers
        run: python scripts/update_database.py

      - name: Commit updated literature data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/papers.json data/runs.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update TL-SAR literature data"
            git push
          fi
